name: ULTIMATE-FILE-CONVERTER
options:
  bundleIdPrefix: com.jeffreyheiler
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"

targets:
  ULTIMATE-FILE-CONVERTER:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: ULTIMATE-FILE-CONVERTER
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffreyheiler.UltimateFileConverter
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "110"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: ULTIMATE-FILE-CONVERTER
        INFOPLIST_KEY_LSMinimumSystemVersion: "13.0"
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Conversion tools (FFmpeg, Pandoc, LibreOffice, 7-Zip, Calibre) are installed on demand via Homebrew and retain their own licenses."
