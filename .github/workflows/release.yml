name: Release v1.0.1

# Builds the shipping artifacts on their native runners and attaches them to the
# existing v1.0.1 GitHub release:
#   - macOS:   ULTIMATE-FILE-CONVERTER-1.0.1.dmg  (rebuilt; replaces the existing asset)
#   - Windows: ULTIMATE-FILE-CONVERTER-1.0.1-x64.msi  +  ...-Setup-1.0.1-x64.exe
#
# Assets are uploaded with `gh release upload --clobber`, which adds/replaces files on the
# release WITHOUT modifying its tag, title, or notes.
#
# Runs only when a push to a claude/** branch carries "[release]" in its commit message
# (so ordinary commits don't rebuild/re-upload the release), or via the Actions
# "Run workflow" button. On build failure each job posts the log tail to the PR so the
# error is visible without the (auth-gated) Actions log.

on:
  push:
    branches:
      - "claude/**"
      - "main"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UFC_VERSION: "1.0.1"
  RELEASE_TAG: "v1.0.1"

jobs:
  # ---------------------------------------------------------------------------
  windows:
    # Only build/publish on an explicit release push (commit message contains "[release]")
    # or a manual dispatch. The `publish` job needs this, so it skips too when this skips.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build installers (MSI + EXE)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress *>&1 | Tee-Object -FilePath build.log
          ./tools/windows/build-installers.ps1 -Version $env:UFC_VERSION *>&1 | Tee-Object -FilePath build.log -Append

      - name: Report Windows failure to PR
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $tail = if (Test-Path build.log) { (Get-Content build.log -Tail 90) -join "`n" } else { "(no build.log)" }
          $body = "### :x: Windows release build failed`n`n"
          $body += "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`n`n"
          $body += "``````n$tail`n```````n`n<!-- release-windows-status -->"
          $body | Out-File body.md -Encoding utf8
          $num = gh pr list --head "$env:BRANCH" --state open --json number --jq '.[0].number'
          if ($num) { gh pr comment $num --body-file body.md }

      - name: Upload Windows installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/windows/msi/*.msi
            dist/windows/setup/*.exe
          if-no-files-found: error

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  macos:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DMG
        run: |
          set -o pipefail
          chmod +x tools/*.sh
          {
            echo "=== brew install build tools ==="
            brew install xcodegen dylibbundler ffmpeg pandoc
            echo "=== brew install --cask libreoffice ==="
            brew install --cask libreoffice
            echo "=== build-installer.sh ==="
            ./tools/build-installer.sh
          } 2>&1 | tee macos.log

      - name: Report macOS failure to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "### :x: macOS release build failed"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            tail -n 120 macos.log 2>/dev/null || echo "(no macos.log)"
            echo '```'
            echo
            echo "<!-- release-macos-status -->"
          } > body.md
          num=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh pr comment "$num" --body-file body.md; fi

      - name: Upload macOS DMG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload macOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          path: macos.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: artifacts/windows

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos

      - name: List downloaded artifacts
        run: find artifacts -type f -printf '%p  (%s bytes)\n'

      - name: Upload assets to the v1.0.1 release (replace DMG, add Windows installers)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # --clobber replaces same-named assets (the DMG) and adds new ones (MSI/EXE)
          # without touching the release tag, title, or body.
          gh release upload "$RELEASE_TAG" \
            artifacts/macos/*.dmg \
            artifacts/windows/msi/*.msi \
            artifacts/windows/setup/*.exe \
            --clobber
