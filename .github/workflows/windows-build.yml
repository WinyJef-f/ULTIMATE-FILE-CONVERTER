name: Windows build

# Builds the WinUI 3 app with MSBuild from Visual Studio (which provides the
# resources.pri / AppxPackage build tasks that the bare dotnet CLI lacks),
# publishing self-contained + unpackaged for win-x64. On success the published
# app is uploaded as an artifact; on failure the errors are posted to the PR as
# a single rolling comment and the full log is uploaded.

on:
  push:
    branches:
      - "claude/**"
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build & publish (MSBuild, Release, win-x64, self-contained, unpackaged)
        shell: pwsh
        run: |
          $proj = "$env:GITHUB_WORKSPACE\Windows\UltimateFileConverter.WinUI\UltimateFileConverter.WinUI.csproj"
          $pub  = "$env:GITHUB_WORKSPACE\publish"

          msbuild $proj /t:Restore /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 `
            *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          msbuild $proj /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true /p:WindowsPackageType=None "/p:PublishDir=$pub/" `
            *>&1 | Tee-Object -FilePath build.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload published app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ULTIMATE-FILE-CONVERTER-win-x64
          path: publish
          if-no-files-found: error

      - name: Report build errors to PR
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $raw = ""
          if (Test-Path build.log) { $raw = Get-Content build.log -Raw }
          $lines = $raw -split "`r?`n"
          $errs = $lines | Where-Object { $_ -match '(?i): error |error [A-Z]+[0-9]|NETSDK[0-9]|MSB[0-9]|XamlCompiler|CS[0-9]{3,}|XLS[0-9]|WMC[0-9]|Build FAILED' } | Select-Object -Last 40
          $tail = $lines | Select-Object -Last 80

          $body = "### :x: Windows build failed`n`n"
          $body += "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`n`n"
          if ($errs) { $body += "**Error / summary lines:**`n``````n" + ($errs -join "`n") + "`n```````n`n" }
          $body += "<details><summary>Last 80 log lines</summary>`n`n``````n" + ($tail -join "`n") + "`n```````n</details>`n`n<!-- windows-build-status -->"
          $body | Out-File body.md -Encoding utf8

          $num = gh pr list --head "$env:BRANCH" --state open --json number --jq '.[0].number'
          if (-not $num) { Write-Host "No open PR for branch $env:BRANCH; skipping comment."; exit 0 }
          gh pr comment $num --body-file body.md --edit-last 2>$null
          if ($LASTEXITCODE -ne 0) { gh pr comment $num --body-file body.md }
